name: Claim an award
description: Apply for your own mathematical solution or Lean formalization contribution.
title: "[Award claim] JSP- "
body:
  - type: markdown
    attributes:
      value: |
        **Only the contributor may submit this claim. Do not apply or collect an award on someone else's behalf.**
        Your submitting GitHub account is the applicant account. Select both roles if you are claiming both contributions. Update an existing claim instead of submitting a duplicate.

        Keep private contact details, identity documents and private confirmation materials out of this issue.

        Before identity confirmation, use your GitHub account or an existing RECIPIENT-<ENTRY>-A placeholder rather than publishing an unconfirmed real-name identity. A submitted form or checked declaration is not identity verification or award approval.
  - type: input
    id: entry
    attributes:
      label: Problem link
      description: Provide the problem-bank link for the JSP identifier in the issue title.
      placeholder: https://github.com/TheJustinSunPrize/awards/blob/main/problems/catalog-0101-0200.md#JSP-000123
    validations:
      required: true
  - type: input
    id: lean_repository
    attributes:
      label: Original Lean proof repository
      description: Provide the original public GitHub repository containing the Lean proof. The repository owner must be the same GitHub account that submits this issue. Do not use a mirror or collection of someone else's proof. Maintainers check repository ownership and the formalization author attribution separately.
      placeholder: https://github.com/YOUR_GITHUB_USERNAME/REPOSITORY
    validations:
      required: true
  - type: input
    id: contact_email
    attributes:
      label: Follow-up contact email
      description: Provide an email address for follow-up communication that you agree to make public in this issue. A dedicated public contact email is recommended. This address alone does not verify your identity or authorship.
      placeholder: contact@example.org
    validations:
      required: true
  - type: dropdown
    id: contribution_type
    attributes:
      label: Contribution being claimed
      description: Both contributions are reviewed separately, even when made by the same person.
      options:
        - Mathematical solution
        - Lean formalization
        - Both mathematical solution and Lean formalization
    validations:
      required: true
  - type: textarea
    id: identity_verification
    attributes:
      label: Identity verification method
      description: Required for mathematical solver claims, including Both, and for Lean claims whose account-to-author connection is not established by the source attribution. Describe how maintainers can independently verify your identity. Examples include emailing thejustinsunprize@hejustinsun.com from an author email listed in the paper, responding through an established institutional or author website, or using a historical signing key already linked to the author. Other independently verifiable methods may be proposed. Lean-only applicants may leave this blank if the source attribution already establishes their account-to-author connection. If claiming both roles, explain how your mathematical author identity connects to this account. Name the method here; send private evidence through the maintainer-designated channel, not this issue.
  - type: textarea
    id: attribution_clarification
    attributes:
      label: Identity or attribution clarification (if needed)
      description: Leave blank if the catalog already identifies your contribution clearly. Explain only what is needed to connect your applicant account to the credited contributor, such as bot commits or a shared project account. Link a correction issue or PR if the catalog needs updating. Do not repeat proof materials or post private identity information.
  - type: textarea
    id: related_claims
    attributes:
      label: Related claims, attribution questions and conflicts
      description: Link previous claims for this work and co-contributors' claims. Disclose overlapping claims, attribution disputes and relevant professional relationships. Update your existing claim instead of submitting a duplicate. Write None if there are no related claims or conflicts.
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Applicant declarations
      options:
        - label: I am applying for my own contribution using my own GitHub account, not applying or collecting on behalf of another person.
          required: true
        - label: My claim concerns my own contribution to the complete solution or Lean proof referenced in the identified problem-bank entry. I have identified any attribution discrepancies that need review.
          required: true
        - label: I have disclosed related claims and attribution conflicts and will complete the maintainer's contribution and identity verification before claiming payment.
          required: true
